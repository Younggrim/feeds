<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Feeds">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon.png">
<title>Feeds</title>
<style>
  :root {
    --bg: #f6f6f4; --card: #ffffff; --text: #16181d; --muted: #6b7079; --line: #e3e3df;
    --accent: #c0392b; --chip: #ececea; --chip-on: #16181d; --chip-on-text: #fff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --card: #171a20; --text: #eceef2; --muted: #8b919c; --line: #262a32;
      --accent: #ff5a4e; --chip: #20242c; --chip-on: #eceef2; --chip-on-text: #0f1115;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    padding-bottom: env(safe-area-inset-bottom); }
  header { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    padding: calc(env(safe-area-inset-top) + 10px) 16px 10px; border-bottom: 1px solid var(--line); }
  .top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  h1 { font-size: 26px; margin: 0; letter-spacing: -0.02em; }
  h1 span { color: var(--accent); }
  #updated { color: var(--muted); font-size: 13px; }
  .controls { display: flex; gap: 8px; margin-top: 10px; }
  input[type=search], select { font: inherit; font-size: 15px; color: var(--text); background: var(--card);
    border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; min-width: 0; }
  input[type=search] { flex: 1; }
  select { max-width: 42%; }
  .chips { display: flex; gap: 8px; margin-top: 8px; overflow-x: auto; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; font: inherit; font-size: 14px; border: 0; border-radius: 999px; padding: 6px 12px;
    background: var(--chip); color: var(--text); cursor: pointer; }
  #cats .chip { font-weight: 600; }
  .chip[aria-pressed=true] { background: var(--chip-on); color: var(--chip-on-text); }
  main { max-width: 760px; margin: 0 auto; padding: 8px 16px 40px; }
  .day { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em;
    color: var(--muted); margin: 18px 0 8px; }
  .v { display: flex; gap: 12px; padding: 10px 0; text-decoration: none; color: inherit;
    border-bottom: 1px solid var(--line); }
  .v.seen { opacity: .45; }
  .thumb { position: relative; flex: none; width: 152px; aspect-ratio: 16/9; border-radius: 10px;
    overflow: hidden; background: var(--chip); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .badge { position: absolute; left: 6px; bottom: 6px; font-size: 11px; font-weight: 700; padding: 2px 6px;
    border-radius: 6px; background: rgba(0,0,0,.75); color: #fff; }
  .new { position: absolute; right: 6px; top: 6px; width: 9px; height: 9px; border-radius: 50%;
    background: var(--accent); box-shadow: 0 0 0 2px var(--card); }
  .meta { min-width: 0; }
  .title { font-weight: 600; font-size: 15px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 3;
    -webkit-box-orient: vertical; overflow: hidden; }
  .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .empty, .note { color: var(--muted); text-align: center; padding: 40px 0; }
  .note { padding: 16px 0 0; font-size: 13px; }
  @media (max-width: 380px) { .thumb { width: 128px; } .title { font-size: 14px; } }
  #player { position: fixed; inset: 0; z-index: 20; background: #000; display: none;
    flex-direction: column; padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  #player.open { display: flex; }
  #player .bar { display: flex; gap: 8px; align-items: center; padding: 10px 12px; }
  #player .bar button, #player .bar a { font: inherit; font-size: 15px; color: #fff; background: rgba(255,255,255,.14);
    border: 0; border-radius: 10px; padding: 8px 12px; text-decoration: none; cursor: pointer; }
  #player .bar .grow { flex: 1; }
  #player .stage { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; }
  #player iframe { width: 100%; max-width: 1100px; aspect-ratio: 16/9; border: 0; background: #000; }
  #player.short iframe { width: auto; height: 100%; max-height: 86vh; aspect-ratio: 9/16; }
  #player .info { color: #eee; padding: 12px 16px 18px; max-width: 1100px; margin: 0 auto; width: 100%; }
  #player .info .t { font-weight: 600; font-size: 16px; }
  #player .info .c { color: #aaa; font-size: 13px; margin-top: 4px; }
  body.playing { overflow: hidden; }
</style>
</head>
<body>
<header>
  <div class="top"><h1>Feeds<span>.</span></h1><div id="updated"></div></div>
  <div class="controls">
    <input id="q" type="search" placeholder="Search titles" autocomplete="off">
    <select id="ch" aria-label="Channel"><option value="">All channels</option></select>
  </div>
  <div class="chips" id="cats"></div>
  <div class="chips">
    <button class="chip" id="fNew" aria-pressed="false">New</button>
    <button class="chip" id="fUnseen" aria-pressed="false">Unwatched</button>
    <button class="chip" id="fShorts" aria-pressed="true">Hide Shorts</button>
    <button class="chip" id="markAll" aria-pressed="false">Mark all watched</button>
  </div>
</header>
<div id="player" role="dialog" aria-modal="true" aria-label="Video player">
  <div class="bar">
    <button id="pClose">✕ Close</button><span class="grow"></span>
    <button id="pNext">Next ›</button>
    <a id="pOpen" target="_blank" rel="noopener">Open in YouTube</a>
  </div>
  <div class="stage"><iframe id="pFrame" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>
  <div class="info"><div class="t" id="pTitle"></div><div class="c" id="pChan"></div></div>
</div>
<main id="list"><div class="empty">Loading…</div></main>
<script>
const BUILD = '__BUILD__';
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
const $ = id => document.getElementById(id);
let data = { videos: [] };
let seen = new Set(store.get('seen', []));
const lastVisit = store.get('lastVisit', 0);
const ORDER = ['Faith', 'Sports', 'Tech & Privacy', 'Outdoors & Gear', 'Fun', 'Local', 'More', 'Discover'];
const state = { q: '', cat: store.get('cat', ''), ch: store.get('channel', ''), onlyNew: false, unseen: store.get('unseen', false), hideShorts: store.get('hideShorts', true) };

function ago(iso) {
  const s = (Date.now() - Date.parse(iso)) / 1000;
  if (s < 3600) return Math.max(1, Math.round(s / 60)) + 'm ago';
  if (s < 86400) return Math.round(s / 3600) + 'h ago';
  return Math.round(s / 86400) + 'd ago';
}
function dayLabel(iso) {
  const d = new Date(iso), t = new Date(); t.setHours(0,0,0,0);
  const diff = Math.round((t - new Date(d.getFullYear(), d.getMonth(), d.getDate())) / 86400000);
  if (diff <= 0) return 'Today'; if (diff === 1) return 'Yesterday';
  return d.toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric' });
}
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function render() {
  const q = state.q.toLowerCase();
  const vids = data.videos.filter(v =>
    (!state.hideShorts || !v.short) &&
    (state.cat ? v.category === state.cat : !v.discover) &&
    (!state.ch || v.channelId === state.ch) &&
    (!state.unseen || !seen.has(v.id)) &&
    (!state.onlyNew || Date.parse(v.published) > lastVisit) &&
    (!q || v.title.toLowerCase().includes(q) || v.channel.toLowerCase().includes(q)));
  if (!vids.length) { $('list').innerHTML = '<div class="empty">Nothing here.</div>'; return; }
  let html = '', day = '';
  for (const v of vids) {
    const d = dayLabel(v.published);
    if (d !== day) { html += `<div class="day">${d}</div>`; day = d; }
    const isNew = lastVisit && Date.parse(v.published) > lastVisit && !seen.has(v.id);
    html += `<a class="v${seen.has(v.id) ? ' seen' : ''}" href="#v-${v.id}" data-id="${v.id}">
      <div class="thumb"><img loading="lazy" alt="" src="https://i.ytimg.com/vi/${v.id}/mqdefault.jpg">
        ${v.short ? '<span class="badge">SHORT</span>' : ''}${isNew ? '<span class="new"></span>' : ''}</div>
      <div class="meta"><div class="title">${esc(v.title)}</div>
        <div class="sub">${v.topic ? `<b>${esc(v.topic)}</b> · ` : ''}${esc(v.channel)} · ${ago(v.published)}</div></div></a>`;
  }
  if (data.missing && data.missing.length) html += `<div class="note">No feed right now for: ${esc(data.missing.join(', '))}</div>`;
  $('list').innerHTML = html;
}

function fillChannels() {
  const chans = [...new Map(data.videos.filter(v => !state.cat || v.category === state.cat).map(v => [v.channelId, v.channel])).entries()]
    .sort((a, b) => a[1].localeCompare(b[1]));
  $('ch').innerHTML = '<option value="">All channels</option>' + chans.map(([id, n]) => `<option value="${id}">${esc(n)}</option>`).join('');
  if (!chans.some(([id]) => id === state.ch)) state.ch = '';
  $('ch').value = state.ch;
}
$('cats').addEventListener('click', e => { const b = e.target.closest('[data-cat]'); if (!b) return;
  state.cat = b.dataset.cat; store.set('cat', state.cat);
  $('cats').querySelectorAll('[data-cat]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  fillChannels(); window.scrollTo(0, 0); render(); });
function setChip(id, on) { $(id).setAttribute('aria-pressed', String(on)); }
$('q').addEventListener('input', e => { state.q = e.target.value; render(); });
$('ch').addEventListener('change', e => { state.ch = e.target.value; store.set('channel', state.ch); render(); });
$('fNew').onclick = () => { state.onlyNew = !state.onlyNew; setChip('fNew', state.onlyNew); render(); };
$('fUnseen').onclick = () => { state.unseen = !state.unseen; store.set('unseen', state.unseen); setChip('fUnseen', state.unseen); render(); };
$('fShorts').onclick = () => { state.hideShorts = !state.hideShorts; store.set('hideShorts', state.hideShorts); setChip('fShorts', state.hideShorts); render(); };
$('markAll').onclick = () => { if (!confirm('Mark everything shown as watched?')) return;
  data.videos.forEach(v => seen.add(v.id)); saveSeen(); render(); };
// Play inside the page instead of handing off to the YouTube app.
let playing = null;
$('list').addEventListener('click', e => { const a = e.target.closest('a.v'); if (!a) return;
  e.preventDefault(); play(a.dataset.id); });
function play(id) {
  const v = data.videos.find(x => x.id === id); if (!v) return;
  playing = id; seen.add(id); saveSeen();
  document.querySelector(`a.v[data-id="${id}"]`)?.classList.add('seen');
  $('pFrame').src = `https://www.youtube-nocookie.com/embed/${id}?autoplay=1&playsinline=1&rel=0&modestbranding=1`;
  $('pOpen').href = v.short ? `https://www.youtube.com/shorts/${id}` : `https://www.youtube.com/watch?v=${id}`;
  $('pTitle').textContent = v.title;
  $('pChan').textContent = (v.topic ? v.topic + ' · ' : '') + v.channel + ' · ' + ago(v.published);
  $('player').classList.toggle('short', !!v.short);
  $('player').classList.add('open'); document.body.classList.add('playing');
  if (location.hash !== '#play') history.pushState(null, '', '#play');
}
function closePlayer(fromHistory) {
  if (!playing) return;
  $('pFrame').src = 'about:blank'; playing = null;
  $('player').classList.remove('open'); document.body.classList.remove('playing');
  if (!fromHistory && location.hash === '#play') history.back();
}
$('pClose').onclick = () => closePlayer(false);
$('pNext').onclick = () => {
  const ids = [...document.querySelectorAll('a.v')].map(a => a.dataset.id);
  const next = ids[ids.indexOf(playing) + 1]; if (next) play(next); else closePlayer(false);
};
window.addEventListener('popstate', () => closePlayer(true));
document.addEventListener('keydown', e => { if (e.key === 'Escape') closePlayer(false); });
function saveSeen() { const keep = new Set(data.videos.map(v => v.id)); seen = new Set([...seen].filter(id => keep.has(id))); store.set('seen', [...seen]); }

async function load() {
  try {
    const r = await fetch('feed.json?t=' + Date.now(), { cache: 'no-store' });
    data = await r.json();
    try {
      const d = await (await fetch('discover.json?t=' + Date.now(), { cache: 'no-store' })).json();
      data.videos = data.videos.concat(d.videos || []);
    } catch {}
  } catch { $('list').innerHTML = '<div class="empty">Couldn’t load the feed. Pull to refresh.</div>'; return; }
  // A home-screen copy can keep running old code for days; reload once when a newer version is live.
  if (data.build && BUILD !== '__BUILD__' && data.build !== BUILD && store.get('reloadedFor', '') !== data.build) {
    store.set('reloadedFor', data.build); location.reload(); return;
  }
  $('updated').textContent = 'Updated ' + ago(data.updated);
  const cats = [...new Set(data.videos.map(v => v.category))].sort((a, b) => (ORDER.indexOf(a) + 99) % 99 - (ORDER.indexOf(b) + 99) % 99);
  if (state.cat && !cats.includes(state.cat)) state.cat = '';
  $('cats').innerHTML = ['', ...cats].map(c => `<button class="chip" data-cat="${esc(c)}" aria-pressed="${c === state.cat}">${c ? esc(c) : 'All'}</button>`).join('');
  fillChannels();
  setChip('fUnseen', state.unseen); setChip('fShorts', state.hideShorts);
  render();
  store.set('lastVisit', Date.now());
}
load();
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') load(); });
</script>
</body>
</html>
